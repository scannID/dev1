services:
  postgres:
    image: postgres:16-alpine
    container_name: scanit-postgres
    environment:
      POSTGRES_DB: scanit
      POSTGRES_USER: scanit
      POSTGRES_PASSWORD: scanit
    ports:
      - "5432:5432"
    volumes:
      - scanit_pg_data:/var/lib/postgresql/data

volumes:
  scanit_pg_data:
