spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:scanny;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  cache:
    type: simple
  data:
    redis:
      host: localhost
      port: 6379
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

keycloak:
  admin-username: test
  admin-password: test

scanny:
  scan-base-url: http://localhost:5173
  redis:
    enabled: false
  cors:
    allowed-origin-patterns: http://localhost:*
  rate-limit:
    enabled: false

spring.security.oauth2.resourceserver.jwt:
  jwk-set-uri: http://localhost:8080/realms/scanny/protocol/openid-connect/certs

scanny.jwt:
  accepted-issuers: http://localhost:8080/realms/scanny,http://127.0.0.1:8080/realms/scanny
  allow-lan-issuers: false
  accepted-audiences:
  accepted-azp:

logging:
  level:
    root: WARN
    com.scanny: INFO
