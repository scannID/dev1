spring:
  application:
    name: scanny-backend
  profiles:
    default: dev
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
    default-encoding: UTF-8
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

server:
  port: ${SERVER_PORT:4000}
  # Only rewrite remote addr from X-Forwarded-* behind a trusted proxy (see prod profile).
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

scanny:
  scan-base-url: ${SCAN_BASE_URL:http://localhost:5173}
  redis:
    enabled: ${REDIS_ENABLED:false}
  cors:
    allowed-origin-patterns: ${SCANNY_CORS_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*}
    allow-wildcard-patterns: ${SCANNY_CORS_ALLOW_WILDCARDS:true}
  client-ip:
    # Default: ignore spoofable X-Forwarded-For. Enable only behind trusted proxies.
    trust-forwarded-headers: ${SCANNY_TRUST_FORWARDED_HEADERS:false}
    trusted-proxies: ${SCANNY_TRUSTED_PROXIES:}
  security:
    headers:
      hsts-enabled: ${SCANNY_HSTS_ENABLED:false}
      hsts-max-age-seconds: ${SCANNY_HSTS_MAX_AGE_SECONDS:31536000}
      content-security-policy: ${SCANNY_CSP:default-src 'none'; frame-ancestors 'none'; base-uri 'none'}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    fail-closed: ${RATE_LIMIT_FAIL_CLOSED:false}
    register-per-min: ${RATE_LIMIT_REGISTER_PER_MIN:5}
    orders-per-min: ${RATE_LIMIT_ORDERS_PER_MIN:30}
    menu-per-min: ${RATE_LIMIT_MENU_PER_MIN:120}
    menu-scan-per-min: ${RATE_LIMIT_MENU_SCAN_PER_MIN:120}
    devices-per-min: ${RATE_LIMIT_DEVICES_PER_MIN:20}
    ticket-scan-per-min: ${RATE_LIMIT_TICKET_SCAN_PER_MIN:60}
    websocket-per-min: ${RATE_LIMIT_WEBSOCKET_PER_MIN:30}
    quick-pay-create-per-min: ${RATE_LIMIT_QUICK_PAY_CREATE_PER_MIN:10}
    payments-initiate-per-min: ${RATE_LIMIT_PAYMENTS_INITIATE_PER_MIN:20}
    payments-status-per-min: ${RATE_LIMIT_PAYMENTS_STATUS_PER_MIN:60}
  websocket:
    auth-timeout-ms: ${WS_AUTH_TIMEOUT_MS:5000}
  mail:
    from: ${MAIL_FROM:noreply@scanny.app}
  pexels:
    api-key: ${PEXELS_API_KEY:}
  fees:
    # Placeholder service fee; PSO % of this fee, remainder to Scanny. Merchant gets subtotal only.
    service-fee-ugx: ${SCANNY_SERVICE_FEE_UGX:700}
    pso-percent: ${SCANNY_PSO_PERCENT:0.30}
  payments:
    default-provider: stub
    fallback-to-stub: ${PAYMENTS_FALLBACK_TO_STUB:true}
    # Scanny fee wallet / collection account reference (provider-specific).
    scanny-fee-destination: ${SCANNY_FEE_DESTINATION:}
    stub:
      auto-complete-seconds: ${PAYMENTS_STUB_AUTO_COMPLETE_SECONDS:0}
    mtn-momo:
      enabled: ${MTN_MOMO_ENABLED:false}
      api-url: ${MTN_MOMO_API_URL:}
      api-key: ${MTN_MOMO_API_KEY:}
      api-secret: ${MTN_MOMO_API_SECRET:}
      subscription-key: ${MTN_MOMO_SUBSCRIPTION_KEY:}
      callback-url: ${MTN_MOMO_CALLBACK_URL:}
    airtel-money:
      enabled: ${AIRTEL_MONEY_ENABLED:false}
      api-url: ${AIRTEL_MONEY_API_URL:}
      api-key: ${AIRTEL_MONEY_API_KEY:}
      api-secret: ${AIRTEL_MONEY_API_SECRET:}
      subscription-key: ${AIRTEL_MONEY_SUBSCRIPTION_KEY:}
      callback-url: ${AIRTEL_MONEY_CALLBACK_URL:}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:scanny}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME:}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:}
  client-id: ${KEYCLOAK_CLIENT_ID:scanny-backend}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:}

# Accept localhost + LAN Keycloak issuers (phone/dev via 192.168.x.x). Signature still via jwk-set-uri.
# Regex default lives in JwtConfig @Value — avoid ':' inside ${...:default} placeholders.
scanny.jwt:
  accepted-issuers: ${SCANNY_JWT_ACCEPTED_ISSUERS:http://localhost:8080/realms/scanny,http://127.0.0.1:8080/realms/scanny}
  # Empty = skip. Set in prod (azp = Keycloak client ids that may call the API).
  accepted-audiences: ${SCANNY_JWT_ACCEPTED_AUDIENCES:}
  accepted-azp: ${SCANNY_JWT_ACCEPTED_AZP:}

spring.security.oauth2.resourceserver.jwt:
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/scanny/protocol/openid-connect/certs}
