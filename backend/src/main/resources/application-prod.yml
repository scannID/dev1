spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  cache:
    type: redis
    redis:
      time-to-live: 60s

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL}
  realm: ${KEYCLOAK_REALM:scanny}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD}
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}

spring.security.oauth2.resourceserver.jwt:
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

scanny.jwt:
  accepted-issuers: ${KEYCLOAK_ISSUER_URI}
  allow-lan-issuers: false

scanny:
  scan-base-url: ${SCAN_BASE_URL}
  redis:
    enabled: true
  cors:
    allowed-origin-patterns: ${SCANNY_CORS_ORIGIN_PATTERNS}
  rate-limit:
    enabled: true
  outbox:
    poll-ms: 500
  payments:
    fallback-to-stub: ${PAYMENTS_FALLBACK_TO_STUB:false}

logging:
  level:
    root: INFO
    com.scanny: INFO
    org.springframework.security: WARN
