.scanny-back:hover {
  color: var(--foreground);
}
.scanny-eyebrow {

  color: var(--primary);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;

}
.scanny-title {

  font-size: clamp(24px, 4vw, 28px);
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--foreground);
}
.scanny-sub {

  color: var(--muted-foreground);

.scanny-form {
  display: grid;

}

  display: grid;

.scanny-label {
  font-size: 13px;

  border-radius: 10px;
  padding: 11px 12px;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.scanny-textarea {
  min-height: 88px;
  resize: vertical;
}
.scanny-input::placeholder, .scanny-textarea::placeholder {
  color: var(--muted-foreground);
}
.scanny-input:focus, .scanny-textarea:focus, .scanny-select:focus {
  border-color: var(--ring);
  box-shadow: 0 0 0 3px var(--ring);
  @supports (color: color-mix(in lab, red, red)) {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 28%, transparent);

  }
  border: 1px solid var(--destructive);

    border: 1px solid color-mix(in srgb, var(--destructive) 40%, transparent);

  border-radius: 10px;
  padding: 10px 12px;
  font-size: 14px;
  line-height: 1.4;

  margin: 0;

.scanny-btn:disabled {

  letter-spacing: 0.04em;
}

  gap: 10px;
  margin-top: 20px;
}
.scanny-stat {

  padding: 12px 14px;
  border: 1px solid var(--border);
}
.scanny-stat-label {
  margin: 0;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted-foreground);

}
.scanny-badge {

  }
  color: var(--primary);
  border: 1px solid var(--primary);
  @supports (color: color-mix(in lab, red, red)) {
    border: 1px solid color-mix(in srgb, var(--primary) 35%, transparent);
  }
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 700;
}
.scanny-qr-wrap {

.scanny-link {

  border-bottom: 1px solid #eef0f2;

}



.cart-line div:first-child {

  display: grid;

  gap: 3px;

}



.cart-line span {

  color: #6b7280;

  font-size: 14px;

}



.stepper {

  display: grid;

  grid-template-columns: 32px 30px 32px;

  align-items: center;

  text-align: center;

}



.stepper button {

  width: 32px;

  height: 32px;

  background: #ffffff;

}



.order-form label {

  display: grid;

  gap: 6px;

  color: #374151;

  font-size: 14px;

  font-weight: 800;

}



.order-form input,

.order-form select,

.order-form textarea,

.order-top select {

  width: 100%;

  box-sizing: border-box;

  color: #111827;

  background: #ffffff;

  border: 1px solid #d1d5db;

  border-radius: 6px;

}



.order-form input,

.order-form select,

.order-top select {

  min-height: 42px;

  padding: 0 12px;

}



.order-form textarea {

  min-height: 76px;

  padding: 10px 12px;

  resize: vertical;

}

.field-error {

  color: #b91c1c !important;

  background: #fff5f5 !important;

  border-color: #dc2626 !important;

}



.field-error:focus {

  border-color: #b91c1c !important;

  box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.16);

  outline: none;

}



.field-error::placeholder {

  color: #ef4444;

}



.field-error-message {

  color: #b91c1c;

  font-size: 13px;

  font-weight: 800;

}



.total-row {

  padding-top: 12px;

  border-top: 1px solid #eef0f2;

}



.payment-box,

.payment-status {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 12px;

  padding: 12px;

  color: #374151;

  background: #f8fafc;

  border: 1px solid #e5e7eb;

  border-radius: 8px;

}



.payment-box span,

.payment-status span {

  color: #6b7280;

  font-size: 14px;

}



.payment-box strong {

  color: #111827;

}



.payment-status select {

  min-height: 38px;

  max-width: 116px;

  color: #111827;

  background: #ffffff;

  border: 1px solid #d1d5db;

  border-radius: 6px;

}



.primary-action {

  height: 36px;

  padding: 0 14px;

  font-size: 13px;

  font-weight: 500;

  color: var(--sidebar-foreground);

  background: var(--sidebar);

  border-color: var(--sidebar);

  border-radius: 8px;

  transition: opacity 0.15s;

}



.primary-action:hover {

  opacity: 0.9;

}



.dashboard-head {

  padding: 16px 20px;

  background: var(--card);

  border: 1px solid var(--border);

  border-radius: 10px;

}



.dashboard-head h3 {

  margin-top: 2px;

  font-size: 20px;

  font-weight: 600;

  letter-spacing: -0.02em;

  color: var(--foreground);

}



.ghost-button {

  min-height: 36px;

  padding: 0 14px;

  color: var(--foreground);

  font-size: 13px;

  font-weight: 500;

  background: var(--muted);

  border: 1px solid var(--border);

  border-radius: 6px;

}



.catalog-count {

  display: inline-grid;

  min-height: 38px;

  place-items: center;

  padding: 0 12px;

  color: var(--primary);

  font-weight: 600;

  background: oklch(from var(--primary) l c h / 10%);

  border: 1px solid oklch(from var(--primary) l c h / 25%);

  border-radius: 999px;

}



.catalog-layout {

  display: grid;

  gap: 20px;

  align-items: start;

}



.catalog-form,

.catalog-table {

  display: grid;

  gap: 14px;

  padding: 18px;

  background: #ffffff;

  border: 1px solid #e5e7eb;

  border-radius: 8px;

  box-shadow: 0 14px 30px rgba(31, 41, 55, 0.06);

}



.catalog-form {

  grid-template-columns: repeat(2, minmax(0, 1fr));

  align-items: end;

}



.catalog-form > div,

.catalog-form label:nth-of-type(4),

.catalog-form .primary-action {

  grid-column: 1 / -1;

}



.catalog-form .inline-check {

  align-self: center;

}



.catalog-form h3 {

  margin: 4px 0 0;

  color: #111827;

  font-size: 22px;

}



.catalog-form label,

.catalog-row label {

  display: grid;

  gap: 6px;

  color: #374151;

  font-size: 14px;

  font-weight: 800;

}



.catalog-form input,

.catalog-form textarea,

.catalog-row input,

.catalog-row textarea {

  width: 100%;

  min-height: 42px;

  padding: 0 12px;

  color: #111827;

  background: #ffffff;

  border: 1px solid #d1d5db;

  border-radius: 6px;

}



.catalog-form textarea,

.catalog-row textarea {

  min-height: 74px;

  padding: 10px 12px;

  resize: vertical;

}



.inline-check,

.availability-toggle {

  display: flex !important;

  grid-template-columns: none;

  align-items: center;

  gap: 10px;

}



.inline-check input,

.availability-toggle input {

  width: 18px;

  min-height: 18px;

  accent-color: #0f766e;

}



.catalog-table {

  gap: 0;

  padding: 0;

  overflow: hidden;

}



.catalog-table-head,

.catalog-row {

  display: grid;

  grid-template-columns: minmax(0, 1fr) 130px 120px 88px;

  gap: 12px;

  align-items: start;

  padding: 14px 16px;

}



.catalog-table-head {

  color: #667085;

  font-size: 12px;

  font-weight: 900;

  letter-spacing: 0.04em;

  text-transform: uppercase;

  background: #f8fafc;

  border-bottom: 1px solid #e5e7eb;

}



.catalog-row {

  border-bottom: 1px solid #eef0f2;

}



.catalog-row:last-child {

  border-bottom: 0;

}



.catalog-row label > span {

  display: block;

  color: #667085;

  font-size: 12px;

  font-weight: 900;

  letter-spacing: 0.03em;

  text-transform: uppercase;

}



.catalog-main-fields {

  display: grid;

  gap: 10px;

}



.catalog-main-fields .description-field {

  grid-column: auto;

}



.danger-button {

  min-height: 40px;

  color: var(--destructive);

  font-weight: 600;

  background: oklch(from var(--destructive) l c h / 10%);

  border: 1px solid oklch(from var(--destructive) l c h / 30%);

  border-radius: 6px;

}



.danger-button:hover {

  background: oklch(from var(--destructive) l c h / 18%);

}



.order-board {

  grid-template-columns: repeat(3, minmax(0, 1fr));

}



.order-card {

  display: grid;

  gap: 16px;

  padding: 16px;

}



.order-top div,

.customer-note {

  display: grid;

  gap: 4px;

}



.order-top select {

  max-width: 140px;

}



.customer-note span {

  color: #6b7280;

  font-size: 14px;

}



.order-items {

  display: grid;

  gap: 8px;

  padding: 0;

  margin: 0;

  list-style: none;

}



.order-items li {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 12px;

  color: #374151;

  font-size: 14px;

}



.empty-state {

  padding: 42px 20px;

  text-align: center;

}

.orders-page {

  display: grid;

  gap: 16px;

}



.orders-table {

  display: grid;

  overflow: hidden;

  background: var(--scan-panel, #ffffff);

  border: 1px solid var(--scan-border, #e5e7eb);

  border-radius: 8px;

  box-shadow: var(--scan-shadow, 0 14px 30px rgba(31, 41, 55, 0.06));

}



.orders-table-head,

.order-row {

  display: grid;

  grid-template-columns: minmax(128px, 0.8fr) minmax(150px, 1fr) minmax(180px, 1.4fr) minmax(100px, 0.7fr) minmax(132px, 0.8fr) minmax(118px, 0.7fr) minmax(96px, 0.6fr);

  gap: 12px;

  align-items: center;

}



/* Table header ΓÇö ref: 10px uppercase tracking-widest, muted-foreground */

.orders-table-head {

  padding: 10px 20px;

  font-size: 10px;

  font-weight: 500;

  letter-spacing: 0.1em;

  text-transform: uppercase;

  color: var(--muted-foreground);

  background: var(--card);

  border-bottom: 1px solid var(--border);

}



/* Table rows ΓÇö ref: hover:bg-muted/50, border-b border-border */

.order-row {

  padding: 12px 20px;

  border-bottom: 1px solid var(--border);

  transition: background 0.12s;

}



.order-row:hover {

  background: oklch(from var(--muted) l c h / 50%);

}



.order-row:last-child {

  border-bottom: 0;

}



.order-id-cell {

  display: grid;

  gap: 2px;

}



.order-id-cell strong,

.order-total-cell {

  color: var(--foreground);

  font-weight: 500;

}



/* Secondary text in cells */

.order-id-cell span {

  color: var(--muted-foreground);

  font-size: 11px;

}



.order-line-items {

  display: flex;

  flex-wrap: wrap;

  gap: 6px;

  padding: 0;

  margin: 0;

  list-style: none;

}



.order-line-items li {

  color: var(--foreground);

  font-size: 12px;

  font-weight: 500;

}



.order-line-items li::after {

  margin-left: 6px;

  color: var(--muted-foreground);

  content: '/';

}



.order-line-items li:last-child::after {

  content: '';

}



.order-row select {

  width: 100%;

  min-height: 36px;

  color: var(--foreground);

  background: var(--background);

  border: 1px solid var(--border);

  border-radius: 6px;

  font-size: 13px;

}



.order-details-button {

  width: 38px;

  height: 38px;

  justify-self: start;

}



.order-drawer-layer {

  position: fixed;

  inset: 0;

  z-index: 50;

}



.order-drawer-backdrop {

  position: absolute;

  inset: 0;

  background: rgba(17, 24, 39, 0.34);

  border: 0;

}



.order-detail-drawer {

  position: absolute;

  top: 0;

  right: 0;

  display: grid;

  align-content: start;

  gap: 16px;

  width: min(420px, 100%);

  height: 100%;

  padding: 22px;

  overflow: auto;

  background: var(--scan-panel, #ffffff);

  border-left: 1px solid var(--scan-border, #e5e7eb);

  box-shadow: -18px 0 42px rgba(17, 24, 39, 0.22);

}



.order-drawer-head {

  display: flex;

  align-items: flex-start;

  justify-content: space-between;

  gap: 16px;

}



.order-detail-drawer h3 {

  margin: 4px 0 0;

  color: var(--scan-text, #111827);

  font-size: 22px;

}



.pagination-controls {

  display: flex;

  flex-wrap: wrap;

  justify-content: flex-end;

  gap: 8px;

}



.pagination-controls button {

  min-width: 38px;

  min-height: 38px;

  padding: 0 12px;

  color: var(--foreground);

  font-weight: 500;

  background: var(--card);

  border: 1px solid var(--border);

  border-radius: 6px;

  transition: background 0.12s, color 0.12s;

}



.pagination-controls button.active {

  color: var(--primary-foreground);

  background: var(--primary);

  border-color: var(--primary);

}



.pagination-controls button:disabled {

  color: var(--muted-foreground);

  cursor: not-allowed;

  background: var(--muted);

  opacity: 0.6;

}



@media (max-width: 1100px) {

  .company-shell,

  .customer-layout,

  .catalog-layout,

  .account-layout {

    grid-template-columns: 1fr;

  }



  .company-sidebar {

    min-height: auto;

  }



  .cart-panel {

    position: static;

  }



  .order-board {

    grid-template-columns: repeat(2, minmax(0, 1fr));

  }

  .orders-table-head {

    display: none;

  }



  .order-row {

    grid-template-columns: 1fr;

    align-items: stretch;

  }



  .pagination-controls {

    justify-content: flex-start;

  }

}



@media (max-width: 720px) {

  .company-sidebar,

  .company-workspace {

    padding: 18px;

  }



  .company-topbar,

  .dashboard-head {

    align-items: stretch;

    flex-direction: column;

  }



  .metric-grid {

    grid-template-columns: 1fr;

  }



  .owner-grid {

    grid-template-columns: 1fr;

  }



  .company-pill,

  .topbar-add-item-button {

    width: fit-content;

  }



  .tabs,

  .tabs button {

    width: 100%;

  }



  .tabs button {

    justify-content: center;

  }



  .item-grid,

  .order-board,

  .catalog-table-head,

  .catalog-row {

    grid-template-columns: 1fr;

  }



  .catalog-table-head {

    display: none;

  }



  .catalog-main-fields {

    grid-template-columns: 1fr;

  }



  .qr-panel {

    grid-template-columns: 68px minmax(0, 1fr);

  }



  .qr-code,

  .qr-panel img,

  .qr-loading {

    width: 68px;

    height: 68px;

  }



  .qr-panel.large {

    grid-template-columns: 1fr;

  }



  .qr-panel.large img,

  .qr-panel.large .qr-loading {

    width: 180px;

    height: 180px;

  }

}



@media screen {

  .company-shell {

    font-size: 14px;

  }



  .company-sidebar h1 {

    font-size: 26px;

    font-weight: 500;

  }



  .company-topbar h2 {

    font-size: 27px;

    font-weight: 500;

  }



  .launch-panel h3 {

    font-size: 26px;

    font-weight: 500;

  }



  .dashboard-head h3,

  .account-form-card h3,

  .link-map h3,

  .catalog-form h3,

  .cart-panel h3,

  .menu-section h3 {

    font-size: 20px;

    font-weight: 500;

  }



  .item-card h4,

  .empty-state h4 {

    font-size: 16px;

    font-weight: 500;

  }



  .eyebrow,

  .side-nav button.active,

  .business span,

  .company-status strong,

  .company-pill,

  .metric-grid strong,

  .setup-list strong,

  .owner-grid strong,

  .link-map strong,

  .mini-list strong,

  .catalog-snapshot strong,

  .catalog-count,

  .catalog-table-head,

  .catalog-row label > span,

  .catalog-form label,

  .catalog-row label,

  .order-form label,

  .item-action strong,

  .total-row strong,

  .order-items strong,

  .cart-line strong,

  .payment-box strong,

  .qr-panel dd,

  .qr-actions button,

  .primary-action,

  .ghost-button,

  .danger-button,

  button,

  strong {

    font-weight: 600;

  }



  .eyebrow,

  .catalog-table-head,

  .catalog-row label > span {

    font-size: 11px;

  }



  .sidebar-copy,

  .metric-grid span,

  .owner-grid span,

  .section-heading span,

  .cart-header span,

  .order-top span,

  .cart-line span,

  .customer-note span,

  .payment-box span,

  .payment-status span,

  .qr-panel p,

  .order-items li,

  .catalog-form label,

  .catalog-row label,

  .order-form label {

    font-size: 13px;

  }



  input,

  textarea,

  select,

  button {

    font-size: 14px;

  }



  .metric-grid strong {

    font-size: 20px;

  }



  .catalog-snapshot h3 {

    font-size: 19px;

    font-weight: 500;

  }

}



/* ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ

   DARK MODE - Toggle with 'D' key

   ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ */



.dark-mode {

  --scan-bg: #1a2226;

  --scan-panel: #222b2f;

  --scan-panel-2: #2a3437;

  --scan-panel-3: #303a3b;

  --scan-border: rgba(199, 218, 184, 0.14);

  --scan-text: #e7ece4;

  --scan-muted: #aab4ac;

  --scan-soft: #c9d8b8;

  --scan-mint: #94c59d;

  --scan-sage: #6f936f;

  --scan-sand: #d5b181;

  --scan-peach: #e7b99b;

  --scan-danger: #e0a19b;

  --scan-shadow: 0 18px 36px rgba(4, 10, 12, 0.36);

}



.dark-mode body {

  background: var(--background);

  color: var(--foreground);

}



.dark-mode .company-shell {

  background: var(--background);

  color: var(--foreground);

}



/* Dark sidebar uses CSS variable ΓÇö no override needed, tokens handle it */

.dark-mode .company-sidebar {

  background: var(--sidebar);

  border-right: none;

}



.dark-mode .company-sidebar h1,

.dark-mode .company-topbar h2,

.dark-mode .dashboard-head h3,

.dark-mode .account-form-card h3,

.dark-mode .link-map h3,

.dark-mode .catalog-form h3,

.dark-mode .cart-panel h3,

.dark-mode .menu-section h3,

.dark-mode .launch-panel h3,

.dark-mode .item-card h4,

.dark-mode .empty-state h4,

.dark-mode .catalog-snapshot h3 {

  color: var(--foreground);

}





.dark-mode .company-workspace { background: var(--background); }



.dark-mode .sidebar-copy,

.dark-mode .company-topbar p:not(.eyebrow),

.dark-mode .launch-panel p,

.dark-mode .muted-copy,

.dark-mode .item-card p,

.dark-mode .empty,

.dark-mode .empty-state p,

.dark-mode .customer-note p,

.dark-mode .section-heading span,

.dark-mode .cart-header span,

.dark-mode .order-top span,

.dark-mode .cart-line span,

.dark-mode .customer-note span,

.dark-mode .payment-box span,

.dark-mode .payment-status span,

.dark-mode .company-status span,

.dark-mode .metric-grid span,

.dark-mode .owner-grid span,

.dark-mode .link-map span,

.dark-mode .mini-list span,

.dark-mode .catalog-snapshot span,

.dark-mode .order-items li,

.dark-mode .qr-panel.large p,

.dark-mode .qr-panel dt {

  color: var(--scan-muted);

}



.dark-mode .eyebrow,

.dark-mode .company-sidebar .eyebrow {

  color: var(--scan-soft);

}



.dark-mode .company-status,

.dark-mode .qr-panel,

.dark-mode .metric-grid div,

.dark-mode .account-form-card,

.dark-mode .link-map,

.dark-mode .mini-list,

.dark-mode .item-card,

.dark-mode .cart-panel,

.dark-mode .order-card,

.dark-mode .empty-state,

.dark-mode .catalog-form,

.dark-mode .catalog-snapshot,

.dark-mode .qr-panel.large {

  background: linear-gradient(180deg, var(--scan-panel) 0%, rgba(32, 42, 46, 0.96) 100%);

  border-color: var(--scan-border);

  box-shadow: var(--scan-shadow);

}



.dark-mode .catalog-row-editing {

  background: rgba(148, 197, 157, 0.07) !important;

  border-top: 2px solid var(--scan-mint) !important;

}



.dark-mode .catalog-edit-fields label {

  color: var(--scan-text);

}



.dark-mode .catalog-search,

.dark-mode .catalog-filter-select,

.dark-mode .catalog-edit-fields input,

.dark-mode .catalog-edit-fields textarea {

  color: var(--scan-text);

  background: var(--scan-panel-2);

  border-color: var(--scan-border);

}



.dark-mode .catalog-search::placeholder {

  color: var(--scan-muted);

}







.dark-mode .launch-panel {

  background:

    radial-gradient(circle at 84% 8%, rgba(148, 197, 157, 0.18), transparent 34%),

    linear-gradient(180deg, #1f312c, #14211e);

}



.dark-mode .metric-grid strong,

.dark-mode .owner-grid strong,

.dark-mode .link-map strong,

.dark-mode .mini-list strong,

.dark-mode .catalog-snapshot strong,

.dark-mode .item-action strong,

.dark-mode .total-row strong,

.dark-mode .order-items strong,

.dark-mode .cart-line strong,

.dark-mode .payment-box strong,

.dark-mode .qr-panel.large strong,

.dark-mode .qr-panel dd,

.dark-mode .company-status strong,

.dark-mode .catalog-row label,

.dark-mode .catalog-form label {

  color: var(--scan-text);

}







.dark-mode .side-nav button { color: var(--muted-foreground); }



.dark-mode .side-nav button:not(.active):hover { background: var(--sidebar-accent); }



.dark-mode .setup-list div,

.dark-mode .owner-grid div,

.dark-mode .payment-box,

.dark-mode .payment-status,

.dark-mode .catalog-snapshot div {

  background: rgba(19, 29, 32, 0.44);

  border-color: var(--scan-border);

}



.dark-mode .setup-list span {

  color: #14211e;

  background: #cfe6b8;

}



.dark-mode input,

.dark-mode textarea,

.dark-mode select,

.dark-mode .order-form input,

.dark-mode .order-form textarea,

.dark-mode .order-form select,

/* ΓöÇΓöÇ Catalog page revamp ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ */



.catalog-page-head {

  display: flex;

  align-items: flex-end;

  justify-content: space-between;

  gap: 16px;

  padding: 18px;

  background: var(--scan-panel, #ffffff);

  border: 1px solid var(--scan-border, #e5e7eb);

  border-radius: 8px;

  box-shadow: var(--scan-shadow, 0 14px 30px rgba(31, 41, 55, 0.06));

}



.catalog-page-head h3 {

  margin: 4px 0 0;

  color: var(--scan-text, #111827);

  font-size: 22px;

}



.catalog-add-btn {

  flex: 0 0 auto;

  min-width: 120px;

  padding: 0 18px;

}



.catalog-filters {

  display: flex;

  flex-wrap: wrap;

  align-items: center;

  gap: 10px;

}



.catalog-search {

  flex: 1 1 200px;

  min-height: 40px;

  padding: 0 12px;

  color: var(--scan-text, #111827);

  background: var(--scan-panel-2, #ffffff);

  border: 1px solid var(--scan-border, #d1d5db);

  border-radius: 6px;

}



.catalog-filter-select {

  min-height: 40px;

  padding: 0 10px;

  color: var(--scan-text, #374151);

  background: var(--scan-panel-2, #ffffff);

  border: 1px solid var(--scan-border, #d1d5db);

  border-radius: 6px;

}



.catalog-results-count {

  margin-left: auto;

  color: var(--scan-muted, #6b7280);

  font-size: 13px;

  white-space: nowrap;

}



.catalog-clear-filters {

  min-height: 36px;

  padding: 0 12px;

  color: var(--scan-soft, #374151);

  font-size: 13px;

  font-weight: 700;

  background: var(--scan-panel-2, #f3f4f6);

  border: 1px solid var(--scan-border, #d1d5db);

  border-radius: 6px;

}



.catalog-items-table {

  display: grid;

  overflow: hidden;

  background: var(--scan-panel, #f9fafb);

  border: 1px solid var(--scan-border, #e5e7eb);

  border-radius: 8px;

  box-shadow: var(--scan-shadow, 0 14px 30px rgba(31, 41, 55, 0.06));

}



.catalog-items-head {

  display: grid;

  grid-template-columns: minmax(0, 1.6fr) minmax(100px, 0.7fr) minmax(110px, 0.6fr) 90px 80px;

  gap: 12px;

  align-items: center;

  padding: 11px 16px;

  color: var(--scan-muted, #667085);

  font-size: 11px;

  font-weight: 800;

  letter-spacing: 0.05em;

  text-transform: uppercase;

  background: var(--scan-panel-2, #f3f4f6);

  border-bottom: 1px solid var(--scan-border, #e5e7eb);

}



.catalog-item-row {

  display: grid;

  grid-template-columns: minmax(0, 1.6fr) minmax(100px, 0.7fr) minmax(110px, 0.6fr) 90px 80px;

  gap: 12px;

  align-items: center;

  padding: 13px 16px;

  border-bottom: 1px solid var(--scan-border, #eef0f2);

}



.catalog-item-row:last-child {

  border-bottom: 0;

}



.catalog-item-row.catalog-row-display {

  transition: background 120ms;

}



.catalog-item-row.catalog-row-display:hover {

  background: var(--scan-panel-3, #f3f4f6);

}



.catalog-row-name {

  display: grid;

  gap: 3px;

  min-width: 0;

}



.catalog-row-name strong {

  color: var(--scan-text, #111827);

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;

}



.catalog-row-name span {

  color: var(--scan-muted, #6b7280);

  font-size: 12px;

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;

}



.catalog-row-category {

  color: var(--scan-muted, #374151);

  font-size: 13px;

}



.catalog-row-price {

  color: var(--scan-text, #111827);

  font-weight: 700;

  font-size: 14px;

}



.catalog-badge {

  display: inline-grid;

  place-items: center;

  min-height: 26px;

  padding: 0 10px;

  font-size: 12px;

  font-weight: 800;

  border-radius: 999px;

}



.catalog-badge.available {

  color: var(--scan-mint, #065f46);

  background: rgba(148, 197, 157, 0.15);

}



.catalog-badge.hidden {

  color: var(--scan-muted, #6b7280);

  background: rgba(0, 0, 0, 0.06);

}



.catalog-edit-btn {

  min-height: 34px;

  padding: 0 14px;

  font-size: 13px;

}



.catalog-edit-fields {

  display: grid;

  grid-template-columns: repeat(3, minmax(0, 1fr));

  gap: 12px;

}



.catalog-edit-fields label {

  display: grid;

  gap: 6px;

  color: var(--scan-soft, #374151);

  font-size: 13px;

  font-weight: 700;

}



.catalog-edit-fields label:nth-child(4) {

  grid-column: 1 / -1;

}



.catalog-edit-fields label:nth-child(5) {

  display: flex;

  align-items: center;

  gap: 8px;

}



.catalog-edit-fields input,

.catalog-edit-fields textarea {

  width: 100%;

  min-height: 38px;

  padding: 0 10px;

  color: var(--scan-text, #111827);

  background: var(--scan-panel, #ffffff);

  border: 1px solid var(--scan-border, #d1d5db);

  border-radius: 6px;

  box-sizing: border-box;

}



.catalog-edit-fields textarea {

  min-height: 66px;

  padding: 8px 10px;

  resize: vertical;

}



.catalog-edit-fields input[type="checkbox"] {

  width: 16px;

  min-height: 16px;

  accent-color: var(--scan-mint, #0f766e);

}



.catalog-edit-actions {

  display: flex;

  gap: 10px;

  flex-wrap: wrap;

}



.catalog-save-btn {

  min-height: 38px;

  padding: 0 18px;

}



.catalog-empty {

  display: grid;

  gap: 12px;

  justify-items: center;

  padding: 40px 20px;

  color: var(--scan-muted, #6b7280);

  text-align: center;

}



.catalog-empty p {

  margin: 0;

}



.pagination-ellipsis {

  display: inline-grid;

  min-width: 38px;

  min-height: 38px;

  place-items: center;

  color: #9ca3af;

}



@media print {

  @page {

    margin: 14mm;

    size: A5 portrait;

  }



  body {

    background: #ffffff;

  }



  body * {

    visibility: hidden;

  }



  .qr-panel.large,

  .qr-panel.large * {

    visibility: visible;

  }



  .qr-panel.large {

    position: fixed;

    inset: 0;

    display: grid;

    grid-template-columns: 1fr;

    place-items: center;

    width: auto;

    min-height: 100vh;

    padding: 0;

    background: #ffffff;

    border: 0;

    box-shadow: none;

  }



  .qr-panel.large .qr-details {

    display: none;

  }



  .qr-panel.large .print-card {

    display: grid;

    width: 100%;

    max-width: 420px;

    gap: 16px;

    padding: 26px;

    border: 2px solid #111827;

    border-radius: 8px;

  }



  .print-card .print-brand,

  .print-card h3,

  .print-card p,

  .print-card strong {

    display: block;

  }



  .print-card h3 {

    margin: 0;

    color: #111827;

    font-size: 34px;

    line-height: 1.1;

  }



  .print-card p {

    max-width: 300px;

    margin: 0;

    color: #374151;

    font-size: 16px;

  }



  .print-card strong {

    max-width: 360px;

    color: #111827;

    font-size: 13px;

    overflow-wrap: anywhere;

  }



  .qr-panel.large .print-card img,

  .qr-panel.large .print-card .qr-loading {

    width: 270px;

    height: 270px;

  }

}



/* Orders Panel Header Styles */

.orders-panel {

  display: grid;

  gap: 0;

}



.orders-panel-head {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 20px;

  padding: 20px;

  background: var(--scan-panel, #ffffff);

  border: 1px solid var(--scan-border, #e5e7eb);

  border-bottom: none;

  border-radius: 8px 8px 0 0;

}



.orders-panel-head h3 {

  margin: 4px 0 0;

  color: var(--scan-text, #111827);

  font-size: 22px;

}



.orders-panel-actions {

  display: flex;

  align-items: center;

  gap: 12px;

}



.orders-count-pill {

  display: inline-flex;

  align-items: center;

  padding: 8px 16px;

  color: #0f3d35;

  font-size: 14px;

  font-weight: 800;

  background: #e7f7ee;

  border: 1px solid #b7e4d0;

  border-radius: 999px;

}



.orders-clear-btn {

  display: inline-flex;

  align-items: center;

  gap: 8px;

  min-height: 40px;

  padding: 0 16px;

  color: #dc2626;

  font-weight: 800;

  background: #fff5f5;

  border: 1px solid #fecaca;

  border-radius: 6px;

  transition: all 0.2s ease;

}



.orders-clear-btn:hover {

  background: #fee2e2;

  border-color: #fca5a5;

}



.orders-table {

  border-radius: 0 0 8px 8px;

  border-top: none;

}



@media (max-width: 720px) {

  .orders-panel-head {

    flex-direction: column;

    align-items: stretch;

  }

  

  .orders-panel-actions {

    flex-direction: column;

  }

  

  .orders-count-pill,

  .orders-clear-btn {

    width: 100%;

    justify-content: center;

  }

}



/* Sidebar Profile */

.sidebar-profile {

  display: flex;

  align-items: center;

  gap: 10px;

  margin-top: auto;

  padding: 8px 10px;

  border-radius: 10px;

  background: var(--sidebar-accent);

  border: 1px solid var(--border);

  cursor: default;

  transition: background 0.15s;

}



.sidebar-profile-avatar {

  flex-shrink: 0;

  width: 32px;

  height: 32px;

  border-radius: 8px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 12px;

  font-weight: 700;

  color: #fff;

  letter-spacing: 0.5px;

}



.sidebar-profile-info {

  flex: 1;

}

.cm-providers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 14px 0 12px;
}

.cm-providers button {
  border: 1px solid var(--cm-border);
  background: #fff;
  border-radius: 14px;
  padding: 14px 10px;
  font: inherit;
  cursor: pointer;
  color: var(--cm-muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: border-color 140ms ease, background 140ms ease, color 140ms ease;
}

.cm-provider-name {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.cm-provider-sub {
  font-size: 11px;
  font-weight: 600;
}

.cm-providers button.active {
  border-color: var(--cm-teal);
  background: var(--cm-teal-soft);
  color: var(--cm-teal);
}

.cm-check {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin: 4px 0 14px;
  font-size: 13px;
  color: var(--cm-muted);
  font-weight: 500;
}

.cm-check input {
  margin-top: 2px;
}

.cm-ref {
  margin: 8px 0 0;
  font-size: 12px;
  color: var(--cm-muted);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

.cm-saved-box {
  margin: 14px 0;
  padding: 14px;
  border-radius: 14px;
  background: var(--cm-teal-soft);
  border: 1px solid color-mix(in srgb, var(--cm-teal) 25%, white);
}

.cm-saved-box strong {
  display: block;
  margin: 4px 0;
  font-size: 18px;
  letter-spacing: -0.02em;
}

.cm-hint {
  margin: 12px 0 0;
  font-size: 12px;
  color: var(--cm-muted);
  line-height: 1.45;
  text-align: center;
}

.cm-error {
  margin: 8px 16px 0;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--cm-danger-bg);
  color: var(--cm-danger);
  border: 1px solid color-mix(in srgb, var(--cm-danger) 40%, transparent);
  font-size: 13px;
  line-height: 1.4;
}

.cm-waiting,
.cm-done {
  text-align: center;
  margin-top: 28px;
}

.cm-waiting-icon,
.cm-done-icon {
  width: 56px;
  height: 56px;
  margin: 0 auto 12px;
  border-radius: 999px;
  background: var(--cm-teal-soft);
  color: var(--cm-teal);
  display: grid;
  place-items: center;
}

.cm-waiting-icon.failed {
  background: var(--cm-danger-bg);
  color: var(--cm-danger);
  font-size: 24px;
  font-weight: 800;
}

.cm-spin {
  animation: cm-spin 0.9s linear infinite;
}

@keyframes cm-spin {
  to {
    transform: rotate(360deg);
  }
}

.cm-waiting-meta {
  margin: 18px 0;
  display: grid;
  gap: 10px;
  text-align: left;
  padding: 12px;
  border-radius: 14px;
  background: var(--cm-bg);
  border: 1px solid var(--cm-border);
}

.cm-waiting-meta > div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
}

.cm-waiting-meta span {
  color: var(--cm-muted);
}

.cm-status-pending {
  color: var(--cm-teal);
}

.cm-status-failed {
  color: var(--cm-danger);
}

.cm-waiting-actions {
  margin-top: 8px;
}

.cm-done-total {
  margin: 12px 0 18px;
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--cm-teal);
}

@media (min-width: 640px) {
  .cm-page {
    max-width: 480px;
    margin: 0 auto;
    border-left: 1px solid var(--cm-border);
    border-right: 1px solid var(--cm-border);
    box-shadow: 0 0 60px rgba(15, 118, 110, 0.06);
  }

  .cm-bottom-bar {
    left: 50%;
    right: auto;
    width: 480px;
    transform: translateX(-50%);
  }
}
