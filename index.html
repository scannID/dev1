<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon — SVG primary, PNG fallbacks, Apple touch -->
    <link rel="icon" type="image/svg+xml" href="/kodte-icon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/kodte-icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/kodte-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FF6A1A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO — updated per-route by usePageMeta; these are the landing-page defaults -->
    <title>Kodte — QR ordering and event ticketing for Uganda</title>
    <meta name="description" content="One QR code lets customers scan, order, and pay from their phone. Sell event tickets at the gate. Built for restaurants, bars, and venues across Uganda." />
    <link rel="canonical" href="https://kodte.ug/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kodte" />
    <meta property="og:url" content="https://kodte.ug/" />
    <meta property="og:title" content="Kodte — QR ordering and event ticketing for Uganda" />
    <meta property="og:description" content="One QR code lets customers scan, order, and pay from their phone. Sell event tickets at the gate. Built for restaurants, bars, and venues across Uganda." />
    <meta property="og:image" content="https://kodte.ug/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_UG" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kodte — QR ordering and event ticketing for Uganda" />
    <meta name="twitter:description" content="One QR code lets customers scan, order, and pay from their phone. Sell event tickets at the gate." />
    <meta name="twitter:image" content="https://kodte.ug/og-image.png" />

    <!-- Structured data — Organization + SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://kodte.ug/#organization",
          "name": "Kodte",
          "legalName": "QBI Labs SMC",
          "url": "https://kodte.ug",
          "logo": {
            "@type": "ImageObject",
            "url": "https://kodte.ug/kodte-icon.svg",
            "width": 512,
            "height": 512
          },
          "description": "QR-powered commerce platform for restaurants, bars, and event venues across Uganda.",
          "foundingLocation": {
            "@type": "Place",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Kampala",
              "addressCountry": "UG"
            }
          },
          "areaServed": {
            "@type": "Country",
            "name": "Uganda"
          }
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://kodte.ug/#app",
          "name": "Kodte",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "url": "https://kodte.ug",
          "publisher": { "@id": "https://kodte.ug/#organization" },
          "description": "One QR code for menus, orders, event tickets, and payments. No app install required for customers.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "UGX",
            "description": "Free to get started"
          },
          "featureList": [
            "QR-powered digital menus",
            "Real-time kitchen order dashboard",
            "Event ticket sales and gate scanning",
            "Mobile money payment tracking"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://kodte.ug/#website",
          "url": "https://kodte.ug",
          "name": "Kodte",
          "publisher": { "@id": "https://kodte.ug/#organization" },
          "inLanguage": "en-UG"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
